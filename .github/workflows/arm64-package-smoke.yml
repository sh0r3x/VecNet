name: Arm64 Package Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64-package-smoke:
    name: ${{ matrix.platform }} package smoke
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux Arm64
            runner: ubuntu-24.04-arm
            rid: linux-arm64
          - platform: Windows Arm64
            runner: windows-11-arm
            rid: win-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Record runner and .NET context
        shell: pwsh
        run: |
          "## VEC-159 ${{ matrix.platform }} runner context" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "| Field | Value |" >> $env:GITHUB_STEP_SUMMARY
          "| --- | --- |" >> $env:GITHUB_STEP_SUMMARY
          "| Runner label | ``${{ matrix.runner }}`` |" >> $env:GITHUB_STEP_SUMMARY
          "| RID under test | ``${{ matrix.rid }}`` |" >> $env:GITHUB_STEP_SUMMARY
          "| Runner OS | `$env:RUNNER_OS` |" >> $env:GITHUB_STEP_SUMMARY
          "| Runner arch | `$env:RUNNER_ARCH` |" >> $env:GITHUB_STEP_SUMMARY
          dotnet --info

      - name: Pack VecNet
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP "vecnet-package"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          [xml] $project = Get-Content -LiteralPath "src/VecNet/VecNet.csproj" -Raw
          $expectedVersion = $project.Project.PropertyGroup |
            ForEach-Object { $_.Version } |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
            Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($expectedVersion)) {
            throw "Could not read VecNet package version from src/VecNet/VecNet.csproj"
          }
          dotnet pack src/VecNet/VecNet.csproj --configuration Release --output $packageDir
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet pack failed with exit code $LASTEXITCODE"
          }
          $package = Get-ChildItem -LiteralPath $packageDir -Filter "VecNet.*.nupkg" | Select-Object -First 1
          if ($null -eq $package) {
            throw "VecNet package was not produced."
          }
          "VECNET_PACKAGE=$($package.FullName)" >> $env:GITHUB_ENV
          "VECNET_PACKAGE_VERSION=$expectedVersion" >> $env:GITHUB_ENV
          "Packed $($package.FullName)"

      - name: Inspect produced package
        shell: pwsh
        run: >
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./eng/package-smoke/Vec159Arm64Probe/Inspect-VecNetPackage.ps1
          -PackagePath "$env:VECNET_PACKAGE"
          -ExpectedVersion "$env:VECNET_PACKAGE_VERSION"

      - name: Run Arm64 package smoke probe
        shell: pwsh
        run: >
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./eng/package-smoke/Vec159Arm64Probe/Invoke-Vec159Arm64Probe.ps1
          -PackagePath "$env:VECNET_PACKAGE"
          -Rid "${{ matrix.rid }}"
          -PlatformName "${{ matrix.platform }}"
          -RunnerLabel "${{ matrix.runner }}"
          -PackageVersion "$env:VECNET_PACKAGE_VERSION"
          -RequireArm64
